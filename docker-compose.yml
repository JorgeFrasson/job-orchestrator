services:
  job-orchestrator-core:
    build:
      context: .
      dockerfile: Dockerfile
    image: job-orchestrator-local:latest
    ports:
      - "3000:3000"
    volumes:
      - core-data:/app/apps/core/data
    networks:
      - job-orchestrator-net

  example-service:
    build:
      context: .
      dockerfile: Dockerfile
    image: job-orchestrator-local:latest
    depends_on:
      - job-orchestrator-core
    environment:
      CORE_URL: ws://job-orchestrator-core:3000
    command: ["node", "packages/example-service/dist/index.js"]
    networks:
      - job-orchestrator-net

networks:
  job-orchestrator-net:

volumes:
  core-data:
