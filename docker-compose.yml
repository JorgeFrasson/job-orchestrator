version: "3.8"
services:
  job-orchestrator-core:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    environment:
      KAFKA_BROKERS: kafka:9092
      KAFKA_MAIN_TOPIC: job-orchestrer-main
      KAFKA_TOPIC_MANAGEMENT_MODE: validate
      KAFKA_TOPIC_PARTITIONS: 1
      KAFKA_TOPIC_REPLICATION_FACTOR: 1
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: postgres
      DB_PASS: postgres
      DB_NAME: joborchestrer
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASS: ""
      REDIS_DB: 0
    # depends_on:
    #   - postgres
    #   - redis
    networks:
      - pos_zap_pos_kafka_net

  # postgres:
  #   image: postgres:15
  #   environment:
  #     POSTGRES_USER: postgres
  #     POSTGRES_PASSWORD: postgres
  #     POSTGRES_DB: job_orchestrer
  #   ports:
  #     - "5432:5432"
  #   networks:
  #     - pos_zap_pos_kafka_net

  # redis:
  #   image: redis:7
  #   ports:
  #     - "6379:6379"
  #   networks:
  #     - pos_zap_pos_kafka_net

networks:
  pos_zap_pos_kafka_net:
    external: true
